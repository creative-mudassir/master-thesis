# ---------------------------------------------------------------
# FIXED WORKFLOW RULES (W1-W7) - shared by ALL systems.
# Freeze this file after Day 1. Any change -> write it in docs/decisions.md
# ---------------------------------------------------------------

year: 2021                      # must match WorldCover 2021 v200 labels

# Months used for the monthly composites (time steps of the cube).
# TO RE-DECIDE for the new AOI (the Apr-Oct choice, D2, was made for the Moscow region and is superseded).
# Run scripts/02_aoi_report.py + 02b_snow_report.py for the new AOI, then record the decision in docs/decisions.md.
months: [4, 5, 6, 7, 8, 9, 10]

grid:
  crs: auto_utm                 # UTM zone of the AOI centre, e.g. EPSG:32633 (D17); computed by edc.aoi.aoi_grid()
  resolution: 10                # metres

# Local Sentinel-2 archive (D16): scenes are downloaded ONCE from Planetary Computer
# (scripts/03a_download_archive.py) and EVERY system reads the same local files, so timings do not depend on the network.
archive:
  root: data/archive/sentinel-2-l2a   # <aoi>_<size>km/catalog.json (local STAC) + <scene id>/<band>.tif + item JSON
  source: planetary-computer          # download source (STAC collection sentinel-2-l2a)
  buffer_m: 500                       # each scene is cut to the 50 km AOI box + this margin, native CRS and
                                      # pixels (no resampling), so every system still does W2 itself

# Sentinel-2 L2A band names (Planetary Computer asset names; also the file names in the archive)
bands: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
scl_band: SCL

cloud_mask:
  # SCL classes REMOVED: 0 no data, 1 saturated/defective, 3 cloud shadow,
  # 8 cloud medium prob., 9 cloud high prob., 10 thin cirrus
  remove_scl_classes: [0, 1, 3, 8, 9, 10]
  keep_snow: true               # SCL 11 (snow) is KEPT (decision, see docs/decisions.md)

scene_filter:
  max_scene_cloud_cover: 80     # % scene cloud cover (eo:cloud_cover), pre-filter before pixel masking.
                                # 80 came from the Moscow test (D14, superseded): re-test for the new AOI.
                                # Applied ONCE when the archive is filled, so all systems get the same scenes.

composite:
  method: median                # per month, per pixel, over valid observations
  gap_fill: training_mean       # month with no valid obs -> 0 after normalisation (= train mean)

resampling:
  spectral: bilinear
  scl: nearest
  labels: nearest

harmonise_baseline_04: true     # scenes with processing baseline >= 04.00 -> DN - 1000

dask_chunks: 1024               # x/y chunk size for loading (lower = less RAM)

labels:
  source: ESA WorldCover 2021 v200
  # WorldCover code -> training class id (255 = ignore)
  remap:
    10: 0    # Tree cover
    20: 1    # Shrubland
    30: 2    # Grassland
    40: 3    # Cropland
    50: 4    # Built-up
    60: 5    # Bare / sparse vegetation
    70: 255  # Snow and ice (not present)
    80: 6    # Permanent water bodies
    90: 7    # Herbaceous wetland
    95: 255  # Mangroves (not present)
    100: 255 # Moss and lichen (not present)
  class_names: [Tree, Shrub, Grass, Crop, Built, Bare, Water, Wetland]

split:
  block_km: 10                  # spatial blocks
  ratios: [0.6, 0.2, 0.2]       # train / val / test (by blocks)
  margin_px: 32                 # pixels at block edges are not used (buffer)
  seed: 42

dataset:
  tile_size: 64                 # CNN tiles
  pixels_per_block: 20000       # Transformer/RF pixel samples per block (before class cap)
  max_train_pixels_per_class: 60000

training:
  seeds: [0, 1, 2]
  epochs: 40
  warmup_epochs: 3
  cnn:         {batch_size: 32,   lr: 0.001,  weight_decay: 0.0001}
  transformer: {batch_size: 2048, lr: 0.0005, weight_decay: 0.01, d_model: 64, layers: 3, heads: 4, ff: 128}
  rf:          {n_estimators: 150, max_depth: 25, min_samples_leaf: 2, max_train_samples: 200000}

benchmark:
  repeats: 3
  area_km: [10, 25, 50]

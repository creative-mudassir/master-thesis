# Candidate study areas (AOIs) in Moscow region.
# Each AOI is a square of size_km x size_km around the centre (in UTM 37N).
# Smaller test areas (10 km, 25 km) use the SAME centre, so grids are nested.
# Run: python scripts/02_aoi_report.py   -> pick the best one, set `selected`.

selected: kolomna

aois:
  kolomna:
    lat: 55.10
    lon: 38.80
    size_km: 50
    note: >
      South-east of Moscow. Kolomna + Voskresensk towns, Oka and Moskva rivers,
      large croplands, mixed forest. Good class balance (recommended).
  serpukhov:
    lat: 54.95
    lon: 37.50
    size_km: 50
    note: >
      South of Moscow. Serpukhov/Chekhov/Pushchino, Oka river, Prioksko-Terrasny
      forest, cropland. Good balance, more forest.
  new_moscow:
    lat: 55.50
    lon: 37.35
    size_km: 50
    note: >
      South-west edge of Moscow city (New Moscow, Troitsk). Much more built-up,
      forest, less cropland. Useful as an urban-heavy AOI.
  ruza:
    lat: 55.70
    lon: 36.25
    size_km: 50
    note: >
      West of Moscow. Ruza and Ozerna reservoirs, forest-dominated, some cropland.
      Forest-heavy AOI.
